# The website and its API on one address: /api/* goes to the API container (prefix removed),
# everything else is the single-page app (any path falls back to index.html for the router).
server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;

    gzip on;
    gzip_types text/css application/javascript application/json image/svg+xml;
    gzip_min_length 1024;

    # look the API container up through Docker's DNS on each request (cached 10 s), not once at
    # start: a recreated API container gets a new address, and a fixed one would answer 502
    resolver 127.0.0.11 valid=10s ipv6=off;
    set $api http://api:8000;

    location /api/ {
        rewrite ^/api/(.*)$ /$1 break;
        proxy_pass $api;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 120s;
    }

    # an optional music file (frontend/public/audio/theme.mp3, not shipped): a plain 404 when absent,
    # so the site falls back to its own generated score
    location /audio/ {
        try_files $uri =404;
    }

    # built files carry a content hash in their name: cache them for a year
    location /assets/ {
        expires 1y;
        add_header Cache-Control "public, immutable";
        try_files $uri =404;
    }

    location / {
        add_header Cache-Control "no-cache";
        try_files $uri /index.html;
    }
}
