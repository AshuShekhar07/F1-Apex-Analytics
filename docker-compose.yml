# Apex21 production stack: PostgreSQL, the API and the scheduled pipeline.
#   cp .env.example .env    (set POSTGRES_PASSWORD, CORS_ORIGINS)
#   docker compose up -d --build
# See DEPLOY.md for loading your existing database into it.
services:
  db:
    image: postgres:16
    restart: unless-stopped
    environment:
      POSTGRES_DB: apex21
      POSTGRES_USER: apex21
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD in .env}
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U apex21 -d apex21"]
      interval: 10s
      retries: 10

  api:
    build: .
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
    environment:
      DATABASE_URL: postgresql://apex21:${POSTGRES_PASSWORD}@db:5432/apex21
      APP_ENV: production
      CORS_ORIGINS: ${CORS_ORIGINS:-}
      SERVE_BRAND_ASSETS: ${SERVE_BRAND_ASSETS:-false}
      RATE_LIMIT_PER_MINUTE: ${RATE_LIMIT_PER_MINUTE:-120}
    ports:
      - "${API_PORT:-8000}:8000"

  scheduler:
    build: .
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
    environment:
      DATABASE_URL: postgresql://apex21:${POSTGRES_PASSWORD}@db:5432/apex21
      APP_ENV: production
    command: ["python", "run_pipeline.py", "--loop"]
    volumes:
      - fastf1cache:/data/fastf1_cache
      - pipelinelogs:/app/logs

volumes:
  pgdata:
  fastf1cache:
  pipelinelogs:
