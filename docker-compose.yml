# Apex21 production stack: PostgreSQL, the API, the scheduled pipeline and the website.
#   cp .env.example .env    (set POSTGRES_PASSWORD)
#   docker compose up -d --build
# The website is on port ${WEB_PORT:-80}; it forwards /api to the API, so the site and its data
# share one address (no CORS setup needed).
# See DEPLOY.md for loading your existing database into it.
services:
  db:
    image: postgres:16
    restart: unless-stopped
    environment:
      POSTGRES_DB: apex21
      POSTGRES_USER: apex21
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD in .env}
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U apex21 -d apex21"]
      interval: 10s
      retries: 10

  api:
    build: .
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
    environment:
      DATABASE_URL: postgresql://apex21:${POSTGRES_PASSWORD}@db:5432/apex21
      APP_ENV: production
      CORS_ORIGINS: ${CORS_ORIGINS:-}
      SERVE_BRAND_ASSETS: ${SERVE_BRAND_ASSETS:-false}
      RATE_LIMIT_PER_MINUTE: ${RATE_LIMIT_PER_MINUTE:-600}
    ports:
      - "${API_PORT:-8000}:8000"

  scheduler:
    build: .
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
    environment:
      DATABASE_URL: postgresql://apex21:${POSTGRES_PASSWORD}@db:5432/apex21
      APP_ENV: production
    command: ["python", "run_pipeline.py", "--loop"]
    healthcheck:
      disable: true            # the image's check is for the API; pipeline failures show on the API's /health
    volumes:
      - fastf1cache:/data/fastf1_cache
      - pipelinelogs:/app/logs

  web:
    build: ./frontend
    restart: unless-stopped
    depends_on:
      - api
    ports:
      - "${WEB_PORT:-80}:80"

volumes:
  pgdata:
  fastf1cache:
  pipelinelogs:
